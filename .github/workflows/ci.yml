name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
      - name: Set Node.js path
        run: echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Install MoonBit toolchain (moonc >= 0.10.14)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo 'moonc version:' && $HOME/.moon/bin/moonc -v

      - name: Add moon to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon check (js target)
        run: moon check --target js

      - name: moon build (js target)
        run: moon build --target js

      - name: moon test (js target)
        run: moon test --target js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jupyter client for protocol smoke test
        run: python -m pip install 'jupyter_client>=8,<9'

      - name: Verify Jupyter client can start and use the kernel
        run: python tools/jupyter_client_smoke.py
