name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MoonBit toolchain (v0.10.4)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          moonup install v0.10.4 || true
          moonup use v0.10.4 || true

      - name: Add moon to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon check (js target)
        run: moon check --target js

      - name: moon test (js target)
        run: moon test --target js --reporter spec
